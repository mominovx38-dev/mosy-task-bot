<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>YOSHLAR ISHLARI AGENTLIGI • MOSY</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070d19;
      --card: #0f1b33;
      --card-2: #152546;
      --accent: #00d2ff;
      --accent-2: #3a7bd5;
      --success: #10b981;
      --danger: #ef4444;
      --warn: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 16px 14px 92px 14px;
      background: radial-gradient(circle at top, #122852 0%, var(--bg) 55%);
      color: var(--text); min-height: 100vh;
    }
    .header {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 12px 14px; margin-bottom: 14px;
    }
    .badge-ring {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; color: #051024; flex-shrink: 0;
    }
    .header-title { font-size: 13px; font-weight: 800; letter-spacing: 0.4px; }
    .header-sub { font-size: 11px; color: var(--accent); font-weight: 700; margin-top: 2px; }
    .section { display: none; }
    .section.active { display: block; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input, textarea, select {
      width: 100%; background: var(--card-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 12px; padding: 10px 12px;
      font-size: 14px; margin-bottom: 12px; outline: none;
    }
    textarea { min-height: 74px; resize: vertical; }
    .btn {
      width: 100%; border: none; border-radius: 13px; padding: 12px 14px;
      font-size: 14px; font-weight: 700; cursor: pointer; color: #fff;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
    }
    .btn-sm { padding: 7px 10px; font-size: 12px; width: auto; border-radius: 10px; display: inline-block; text-decoration: none; }
    .btn-success { background: var(--success); }
    .worker-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card-2); padding: 10px 12px; border-radius: 11px; margin-bottom: 8px;
    }
    .worker-item input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .pill-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .pill-bad { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .pill-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(9, 17, 34, 0.96); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 8px 6px; z-index: 99;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      display: none; flex-direction: column; align-items: center;
      font-size: 10px; font-weight: 600; cursor: pointer; gap: 3px;
    }
    .nav-btn.visible { display: flex; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn span.ico { font-size: 18px; }
    .date-group-title {
      font-size: 12px; font-weight: 800; color: var(--accent);
      margin: 12px 0 6px 0; padding-bottom: 4px; border-bottom: 1px solid var(--border);
    }
    .file-link { color: var(--accent); font-size: 12px; font-weight: 700; text-decoration: none; }
    .sample-box {
      margin-top: 8px; padding: 8px; border-radius: 10px;
      background: rgba(0, 210, 255, 0.08); border: 1px solid rgba(0, 210, 255, 0.22);
    }
    .sample-box img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }

    body:not(.admin-active) #sec-create,
    body:not(.admin-active) #sec-monitoring,
    body:not(.admin-active) #btn-create,
    body:not(.admin-active) #btn-monitoring {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge-ring">MOSY</div>
    <div>
      <div class="header-title">YOSHLAR ISHLARI AGENTLIGI</div>
      <div class="header-sub" id="role-subtitle">MOSY • NAZORAT VA TOPSHIRIQLAR MARKAZI</div>
    </div>
  </div>

  <!-- ADMIN: TOPSHIRIQ YARATISH -->
  <div id="sec-create" class="section">
    <div class="card">
      <label>Topshiriq sarlavhasi</label>
      <input id="t-title" placeholder="Masalan: MFY yoshlar ro‘yxatini yangilash" />

      <label>Topshiriq mazmuni</label>
      <textarea id="t-desc" placeholder="Batafsil vazifa mazmuni..."></textarea>

      <label>Izoh / Bajarish yo‘riqnomasi</label>
      <textarea id="t-instr" placeholder="Masalan: Shu rasmdagidek rasmli hisobot qilib yuboring..."></textarea>

      <label>Namuna rasm yuklash (ixtiyoriy — majburiy emas)</label>
      <input id="t-sample" type="file" accept="image/*" />

      <label>Ilova fayl (ixtiyoriy)</label>
      <input id="t-file" type="file" />

      <label>Muddat (Deadline)</label>
      <input id="t-deadline" placeholder="Masalan: Bugun 18:00 gacha" />

      <label>Javob formati cheklovi</label>
      <select id="t-type">
        <option value="photo">Faqat rasm</option>
        <option value="file">Faqat fayl (Excel / Word / PDF)</option>
        <option value="both">Rasm va fayl</option>
        <option value="text">Faqat matn</option>
      </select>

      <label>Ogohlantirish vaqtini belgilash</label>
      <select id="t-alert">
        <option value="10m">Har 10 daqiqada</option>
        <option value="1h">Har 1 soatda</option>
        <option value="2h">Har 2 soatda</option>
      </select>

      <label>Ogohlantirish matni</label>
      <input id="t-call" placeholder="Masalan: Shoshilinch topshiriq yuborildi!" />

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label style="margin:0;">Xodimlarni tanlash</label>
        <button class="btn btn-sm" type="button" onclick="toggleSelectAll()">☑️ Hammasini belgilash</button>
      </div>
      <div id="workers-list">Yuklanmoqda...</div>

      <button class="btn" type="button" style="margin-top:10px;" onclick="sendTask()">🚀 Topshiriqni yuborish</button>
    </div>
  </div>

  <!-- ADMIN: MONITORING JADVALI -->
  <div id="sec-monitoring" class="section">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong style="font-size:14px;">📊 Monitoring Jadvali</strong>
        <a href="/api/export/excel" target="_blank" class="btn btn-sm btn-success">📥 Excel yuklash</a>
      </div>
      <div id="monitoring-box">Yuklanmoqda...</div>
    </div>
  </div>

  <!-- XODIM: MENING TOPSHIRIQLARIM -->
  <div id="sec-my-tasks" class="section">
    <div class="card">
      <strong style="font-size:14px; display:block; margin-bottom:10px;">📋 Mening topshiriqlarim</strong>
      <div id="my-tasks-box">Sizga biriktirilgan topshiriqlar yo‘q.</div>
    </div>
  </div>

  <!-- RAD ETILGAN -->
  <div id="sec-rejected" class="section">
    <div class="card">
      <strong style="font-size:14px; display:block; margin-bottom:10px;">♻️ Rad etilgan topshiriqlar</strong>
      <div id="rejected-box">Yuklanmoqda...</div>
    </div>
  </div>

  <div class="bottom-nav">
    <button id="btn-create" class="nav-btn" type="button" onclick="switchTab('create', this)">
      <span class="ico">➕</span><span>Berish</span>
    </button>
    <button id="btn-monitoring" class="nav-btn" type="button" onclick="switchTab('monitoring', this)">
      <span class="ico">📊</span><span>Monitoring</span>
    </button>
    <button id="btn-my-tasks" class="nav-btn visible" type="button" onclick="switchTab('my-tasks', this)">
      <span class="ico">📋</span><span>Topshiriq</span>
    </button>
    <button id="btn-rejected" class="nav-btn visible" type="button" onclick="switchTab('rejected', this)">
      <span class="ico">♻️</span><span>Rad etilgan</span>
    </button>
  </div>

  <script>
    const ADMIN_ID_CONST = 7798667020;
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = (urlParams.get("role") || "").toLowerCase();
    const tabParam = (urlParams.get("tab") || "").toLowerCase();
    const userIdParam = Number(urlParams.get("user_id") || 0);

    let tgUserId = userIdParam || Number(tg?.initDataUnsafe?.user?.id || 0) || 0;
    let isAdmin = (roleParam === "admin") && (tgUserId === ADMIN_ID_CONST);

    function notify(msg) {
      if (tg && tg.showAlert) tg.showAlert(msg);
      else alert(msg);
    }

    function applyRoleState() {
      if (isAdmin) {
        document.body.classList.add("admin-active");
        document.getElementById("role-subtitle").textContent = `ADMIN PANEL • ID: ${tgUserId}`;
        document.getElementById("btn-create").classList.add("visible");
        document.getElementById("btn-monitoring").classList.add("visible");
      } else {
        document.body.classList.remove("admin-active");
        document.getElementById("role-subtitle").textContent = "MOSY • NAZORAT VA TOPSHIRIQLAR MARKAZI";
        document.getElementById("btn-create").classList.remove("visible");
        document.getElementById("btn-monitoring").classList.remove("visible");
      }
    }

    async function initApp() {
      if (tgUserId) {
        try {
          const res = await fetch(`/api/me?user_id=${tgUserId}`, { cache: "no-store" });
          const data = await res.json();
          isAdmin = Boolean(data.is_admin) && (roleParam === "admin") && (tgUserId === ADMIN_ID_CONST);
        } catch (e) {
          isAdmin = (roleParam === "admin") && (tgUserId === ADMIN_ID_CONST);
        }
      } else {
        isAdmin = false;
      }

      applyRoleState();

      if (isAdmin) {
        await loadWorkers();
        const startTab = (tabParam === "monitoring" || tabParam === "rejected") ? tabParam : "create";
        const btnMap = {
          "create": document.getElementById("btn-create"),
          "monitoring": document.getElementById("btn-monitoring"),
          "rejected": document.getElementById("btn-rejected")
        };
        switchTab(startTab, btnMap[startTab]);
      } else {
        const startTab = (tabParam === "rejected") ? "rejected" : "my-tasks";
        const btnEl = startTab === "rejected"
          ? document.getElementById("btn-rejected")
          : document.getElementById("btn-my-tasks");
        switchTab(startTab, btnEl);
      }
    }

    function switchTab(name, btnEl) {
      if (!isAdmin && (name === "create" || name === "monitoring")) {
        name = "my-tasks";
        btnEl = document.getElementById("btn-my-tasks");
      }
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.getElementById("sec-" + name).classList.add("active");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");

      if (name === "monitoring") loadMonitoring();
      if (name === "my-tasks") loadMyTasks();
      if (name === "rejected") loadRejected();
    }

    async function loadWorkers() {
      if (!isAdmin) return;
      const res = await fetch("/api/workers", { cache: "no-store" });
      const list = await res.json();
      const box = document.getElementById("workers-list");
      if (!list.length) {
        box.innerHTML = `<div style="color:var(--muted); font-size:12px;">Hali xodimlar ro‘yxatdan o‘tmagan.</div>`;
        return;
      }
      box.innerHTML = list.map(w => `
        <label class="worker-item">
          <span><b>${w.full_name}</b> <small style="color:var(--muted);">(${w.mfy})</small></span>
          <input type="checkbox" class="w-check" value="${w.user_id}" />
        </label>
      `).join("");
    }

    function toggleSelectAll() {
      const boxes = [...document.querySelectorAll(".w-check")];
      const allChecked = boxes.length > 0 && boxes.every(b => b.checked);
      boxes.forEach(b => b.checked = !allChecked);
    }

    async function sendTask() {
      if (!isAdmin) return;
      const selected = [...document.querySelectorAll(".w-check:checked")].map(b => Number(b.value));
      const title = document.getElementById("t-title").value.trim();
      const description = document.getElementById("t-desc").value.trim();
      const instruction = document.getElementById("t-instr").value.trim();
      const deadline = document.getElementById("t-deadline").value.trim();
      const answerType = document.getElementById("t-type").value;
      const alertInterval = document.getElementById("t-alert").value;
      const callMsg = document.getElementById("t-call").value.trim();
      const sampleInput = document.getElementById("t-sample");
      const fileInput = document.getElementById("t-file");

      if (!title || !description || !deadline || !selected.length) {
        notify("Sarlavha, mazmun, muddat va kamida 1 ta xodimni tanlang!");
        return;
      }

      const fd = new FormData();
      fd.append("admin_id", String(ADMIN_ID_CONST));
      fd.append("title", title);
      fd.append("description", description);
      fd.append("instruction", instruction);
      fd.append("deadline", deadline);
      fd.append("answer_type", answerType);
      fd.append("alert_interval", alertInterval);
      fd.append("call_message", callMsg);
      fd.append("user_ids_csv", selected.join(","));

      if (sampleInput.files && sampleInput.files[0]) {
        fd.append("sample_photo", sampleInput.files[0]);
      }
      if (fileInput.files && fileInput.files[0]) {
        fd.append("task_file", fileInput.files[0]);
      }

      const res = await fetch("/api/tasks", { method: "POST", body: fd });
      const out = await res.json();
      if (out.ok) {
        notify("✅ Topshiriq yuborildi!");
        document.getElementById("t-title").value = "";
        document.getElementById("t-desc").value = "";
        document.getElementById("t-instr").value = "";
        document.getElementById("t-call").value = "";
        sampleInput.value = "";
        fileInput.value = "";
      } else {
        notify(out.detail || "Xatolik yuz berdi.");
      }
    }

    function intervalText(code) {
      if (code === "1h") return "Har 1 soatda";
      if (code === "2h") return "Har 2 soatda";
      return "Har 10 daqiqada";
    }

    async function loadMonitoring() {
      if (!isAdmin) return;
      const res = await fetch("/api/monitoring", { cache: "no-store" });
      const rows = await res.json();
      const box = document.getElementById("monitoring-box");
      if (!rows.length) { box.innerHTML = "Hali monitoring ma’lumotlari yo‘q."; return; }
      box.innerHTML = rows.map(r => {
        const badge = r.status === "approved"
          ? `<span class="pill pill-ok">Tasdiqlandi</span>`
          : r.status === "submitted"
          ? `<span class="pill pill-ok">Bajardi</span>`
          : r.status === "rejected"
          ? `<span class="pill pill-bad">Rad etildi</span>`
          : `<span class="pill pill-warn">Bajarmadi</span>`;

        const sampleHtml = r.has_sample_photo
          ? `<div style="margin-top:4px;"><a class="file-link" href="/api/files/sample/${r.task_id}" target="_blank">🖼 Namuna rasm: ${r.sample_photo_name || "rasm.jpg"}</a></div>`
          : "";

        const taskFileHtml = r.has_task_file && r.task_file_name
          ? `<div style="margin-top:4px;"><a class="file-link" href="/api/files/task/${r.task_id}" target="_blank">📎 Topshiriq fayli: ${r.task_file_name}</a></div>`
          : "";

        const answerFileHtml = r.has_answer_file && r.file_name
          ? `<div style="margin-top:4px;"><a class="file-link" href="/api/files/answer/${r.id}" target="_blank">📥 Xodim yuklagan fayl: ${r.file_name}</a></div>`
          : (r.file_name ? `<div style="font-size:11px; color:var(--accent); margin-top:3px;">📎 Fayl: ${r.file_name}</div>` : "");

        return `
          <div class="worker-item" style="display:block;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <b>${r.full_name} (${r.mfy})</b>
              ${badge}
            </div>
            <div style="font-size:12px; color:var(--accent); margin-top:5px;"><b>Topshiriq:</b> ${r.title}</div>
            <div style="font-size:12px; margin-top:3px;"><b>Topshiriq matni:</b> ${r.description || "—"}</div>
            ${r.instruction ? `<div style="font-size:12px; color:#cbd5e1; margin-top:3px;"><b>Izoh:</b> ${r.instruction}</div>` : ""}
            <div style="font-size:11px; color:var(--muted); margin-top:3px;"><b>Ogohlantirish:</b> ${intervalText(r.alert_interval)}</div>
            ${r.answer_text ? `<div style="font-size:12px; color:#cbd5e1; margin-top:3px;"><b>Javob matni:</b> ${r.answer_text}</div>` : ""}
            ${sampleHtml}
            ${taskFileHtml}
            ${answerFileHtml}
            <div style="font-size:11px; color:var(--muted); margin-top:5px;">
              O‘qildi: ${r.read_at || "O‘qilmagan"} | Topshirildi: ${r.submitted_at || "-"}
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadMyTasks() {
      const box = document.getElementById("my-tasks-box");
      if (!tgUserId) {
        box.innerHTML = "Sizga biriktirilgan topshiriqlar yo‘q.";
        return;
      }
      const res = await fetch(`/api/my-tasks?user_id=${tgUserId}`, { cache: "no-store" });
      const list = await res.json();
      if (!list.length) {
        box.innerHTML = "Sizga biriktirilgan topshiriqlar yo‘q.";
        return;
      }
      box.innerHTML = list.map(t => `
        <div class="worker-item" style="display:block;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b>${t.title}</b>
            <span class="pill ${t.status === 'rejected' ? 'pill-bad' : (t.status === 'approved' || t.status === 'submitted' ? 'pill-ok' : 'pill-warn')}">${t.status}</span>
          </div>
          <div style="font-size:12px; margin-top:5px;">${t.description}</div>
          ${t.instruction ? `<div style="font-size:12px; color:#cbd5e1; margin-top:4px;"><b>Izoh:</b> ${t.instruction}</div>` : ""}
          <div style="font-size:11px; color:var(--accent); margin-top:4px;">Muddat: ${t.deadline} | Format: ${t.answer_type}</div>
          ${t.has_sample_photo ? `
            <div class="sample-box">
              <div style="font-size:11px; color:var(--accent); font-weight:700;">🖼 Namuna rasm:</div>
              <img src="/api/files/sample/${t.task_id}" alt="Namuna rasm" />
            </div>
          ` : ""}
          ${t.has_task_file && t.task_file_name ? `
            <div style="margin-top:6px;">
              <a class="file-link" href="/api/files/task/${t.task_id}" target="_blank">📎 Faylni yuklash (${t.task_file_name})</a>
            </div>
          ` : ""}
          ${t.status === 'rejected' && t.last_reason ? `
            <div style="margin-top:6px; padding:8px; border-radius:8px; background:rgba(239,68,68,0.15); font-size:12px; color:#fca5a5;">
              Sizning bergan topshirigingiz shu sababga ko‘ra rad etildi: <b>${t.last_reason}</b>
            </div>
          ` : ""}
          <div style="margin-top:10px; padding-top:8px; border-top:1px solid var(--border);">
            <label style="font-size:11px;">Javob matni / izoh</label>
            <input id="ans-txt-${t.id}" value="${(t.answer_text || '').replace(/"/g, '&quot;')}" placeholder="Javob matnini kiriting..." style="margin-bottom:8px;" />
            <label style="font-size:11px;">Fayl / rasm yuklash</label>
            <input id="ans-file-${t.id}" type="file" style="margin-bottom:8px;" />
            ${t.file_name ? `<div style="font-size:11px; color:var(--accent); margin-bottom:6px;">Yuklangan fayl: ${t.file_name}</div>` : ""}
            <button class="btn btn-sm btn-success" type="button" onclick="submitTaskFromPanel(${t.id})">📤 Javobni yuklash</button>
          </div>
        </div>
      `).join("");
    }

    async function submitTaskFromPanel(assignmentId) {
      const txtEl = document.getElementById(`ans-txt-${assignmentId}`);
      const fileEl = document.getElementById(`ans-file-${assignmentId}`);
      const fd = new FormData();
      fd.append("user_id", String(tgUserId));
      fd.append("answer_text", txtEl ? txtEl.value.trim() : "");
      if (fileEl && fileEl.files && fileEl.files[0]) {
        fd.append("upload_file", fileEl.files[0]);
      }

      const res = await fetch(`/api/my-tasks/${assignmentId}/submit`, {
        method: "POST",
        body: fd
      });
      const out = await res.json();
      if (res.ok && out.ok) {
        notify("✅ Javob va fayl muvaffaqiyatli yuklandi!");
        loadMyTasks();
      } else {
        notify(out.detail || "Javob yuklashda xatolik.");
      }
    }

    async function loadRejected() {
      const q = isAdmin ? "" : (tgUserId ? `?user_id=${tgUserId}` : "");
      const res = await fetch(`/api/rejections${q}`, { cache: "no-store" });
      const items = await res.json();
      const box = document.getElementById("rejected-box");
      if (!items.length) { box.innerHTML = "Rad etilgan topshiriqlar mavjud emas."; return; }

      const grouped = {};
      for (const item of items) {
        grouped[item.rejected_date] = grouped[item.rejected_date] || [];
        grouped[item.rejected_date].push(item);
      }

      let html = "";
      for (const [day, list] of Object.entries(grouped)) {
        html += `<div class="date-group-title">📅 ${day}</div>`;
        for (const r of list) {
          html += `
            <div class="worker-item" style="display:block;">
              <b>${r.task_title}</b> <small style="color:var(--muted);">(${r.rejected_at})</small>
              ${isAdmin ? `<div style="font-size:11px; color:var(--accent);">Xodim: ${r.full_name} — ${r.mfy}</div>` : ""}
              <div style="font-size:12px; color:#fca5a5; margin-top:4px;">Sabab: ${r.reason}</div>
            </div>
          `;
        }
      }
      box.innerHTML = html;
    }

    initApp();
  </script>
</body>
</html>
